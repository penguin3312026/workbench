<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的测评结果 · 管理方格</title>
<style>
  :root{
    --bg:#0f1117; --surface:#171a21; --surface2:#1f232c; --border:#2a2f3a;
    --text:#e6edf3; --muted:#9aa4b2; --accent:#378ADD; --gold:#e3b341;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.6;padding:20px 16px 60px}
  .head{text-align:center;margin-bottom:16px}
  .head h1{font-size:20px;margin:0 0 4px}
  .type{font-size:26px;font-weight:800;text-align:center;color:var(--gold);margin:10px 0}
  .desc{font-size:13px;color:var(--muted);text-align:center;max-width:420px;margin:0 auto 18px}
  .scores{display:flex;gap:12px;margin:16px 0}
  .score{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
  .score .lab{font-size:12px;color:var(--muted)}
  .score .val{font-size:30px;font-weight:800;margin:4px 0}
  .score .badge{display:inline-block;font-size:12px;border:1px solid var(--border);border-radius:999px;padding:1px 10px}
  .gridwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center;margin:18px 0}
  .gridwrap svg{background:var(--surface);border:1px solid var(--border);border-radius:10px}
  .coord{font-size:14px;color:var(--muted)}
  .advice{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:14px}
  .advice h3{margin:0 0 10px;font-size:15px}
  .advice ol{margin:0;padding-left:20px}
  .advice li{margin:6px 0;font-size:14px}
  .qrbox{background:#fff;border-radius:14px;padding:16px;display:inline-block;margin:16px auto 0}
  .qrbox img{display:block;width:180px;height:180px}
  .center{text-align:center}
  .tip{color:var(--muted);font-size:13px;text-align:center}
  .err{color:#f85149;text-align:center;margin-top:30px;font-size:14px}
</style>
</head>
<body>
<div id="view">
  <div class="head"><h1>我的管理方格测评结果</h1></div>
  <div class="err" id="err" style="display:none"></div>
  <div id="content" style="display:none">
    <div class="type" id="typeName">—</div>
    <div class="desc" id="typeDesc"></div>
    <div class="scores">
      <div class="score">
        <div class="lab">生产导向 P（满分 90）</div>
        <div class="val" id="pVal">—</div>
        <div class="badge" id="pTier">—</div>
      </div>
      <div class="score">
        <div class="lab">人本导向 H（满分 90）</div>
        <div class="val" id="hVal">—</div>
        <div class="badge" id="hTier">—</div>
      </div>
    </div>
    <div class="gridwrap">
      <div id="svgWrap"></div>
      <div class="coord">方格坐标：<b id="coordTxt">—</b></div>
    </div>
    <div class="advice">
      <h3 id="advTitle">改善建议</h3>
      <ol id="advBody"></ol>
    </div>
    <div class="center">
      <p class="tip">保存/分享此二维码，随时扫码看自己的结果</p>
      <div class="qrbox"><div id="qr"></div></div>
    </div>
    <p class="tip" style="margin-top:14px"><a class="ghost" href="index.html" style="color:var(--accent)">← 返回答题</a></p>
  </div>
</div>

<script src="assets/js/qrcode.js"></script>
<script>
const API = '/api/quiz';
function tierLabel(t){return t==='high'?'高':t==='med'?'中':'低';}
function tierColor(t){return t==='high'?'var(--green)':t==='med'?'var(--gold)':'var(--red)';}

function renderGrid(pc, hc){
  const S=300, pad=34, unit=30;
  const X=v=>pad+(v-1)*unit, Y=v=>pad+(9-v)*unit;
  const arch={"(1,9)":[1,9],"(9,1)":[9,1],"(1,1)":[1,1],"(5,5)":[5,5],"(9,9)":[9,9]};
  const colors={"(9,9)":"#3fb950","(9,1)":"#f85149","(1,9)":"#58a6ff","(5,5)":"#bc8cff","(1,1)":"#6e7681"};
  let g='';
  for(let k=1;k<=9;k++){
    g+=`<line x1="${X(k)}" y1="${Y(9)}" x2="${X(k)}" y2="${Y(1)}" stroke="#2b3340"/>`;
    g+=`<line x1="${X(1)}" y1="${Y(k)}" x2="${X(9)}" y2="${Y(k)}" stroke="#2b3340"/>`;
  }
  g+=`<text x="${X(5)}" y="${S-4}" fill="#9aa7b4" font-size="11" text-anchor="middle">关心生产 →</text>`;
  g+=`<text x="12" y="${Y(5)}" fill="#9aa7b4" font-size="11" text-anchor="middle" transform="rotate(-90 12 ${Y(5)})">关心人 ↑</text>`;
  for(const k in arch){const [a,b]=arch[k];
    g+=`<circle cx="${X(a)}" cy="${Y(b)}" r="4" fill="${colors[k]}" opacity="0.85"/>`;
    g+=`<text x="${X(a)+6}" y="${Y(b)-6}" fill="${colors[k]}" font-size="10">${k}</text>`;}
  g+=`<circle cx="${X(pc)}" cy="${Y(hc)}" r="7" fill="#fff" stroke="#e3b341" stroke-width="3"/>`;
  document.getElementById('svgWrap').innerHTML=
    `<svg width="${S}" height="${S}" viewBox="0 0 ${S} ${S}">${g}</svg>`;
}

function makeQR(text){
  const qr=qrcode(0,'M'); qr.addData(text); qr.make();
  return qr.createDataURL(6,10);
}

async function init(){
  const token = new URLSearchParams(location.search).get('token');
  if(!token){ showErr('链接缺少 token'); return; }
  try{
    const r = await fetch(API + '/result?token=' + encodeURIComponent(token));
    const data = await r.json();
    if(!r.ok) throw new Error(data.error || '加载失败');
    document.getElementById('typeName').textContent = data.type;
    document.getElementById('typeDesc').textContent = data.desc;
    document.getElementById('pVal').textContent = data.P;
    document.getElementById('hVal').textContent = data.H;
    const pb=document.getElementById('pTier'); pb.textContent=tierLabel(data.pt); pb.style.color=tierColor(data.pt);
    const hb=document.getElementById('hTier'); hb.textContent=tierLabel(data.ht); hb.style.color=tierColor(data.ht);
    document.getElementById('coordTxt').textContent=`( ${data.pc.toFixed(1)}, ${data.hc.toFixed(1)} )`;
    renderGrid(data.pc, data.hc);
    document.getElementById('advTitle').textContent='针对偏弱维度的改善建议 · '+data.weak;
    document.getElementById('advBody').innerHTML=data.advice.map(a=>`<li>${a}</li>`).join('');
    const url = location.origin + '/modules/quiz/lookup.html?token=' + token;
    document.getElementById('qr').innerHTML=`<img src="${makeQR(url)}" alt="结果二维码">`;
    document.getElementById('content').style.display='block';
  }catch(e){ showErr(e.message); }
}
function showErr(m){
  const el=document.getElementById('err'); el.style.display='block';
  el.textContent='⚠ '+m;
}
init();
</script>
</body>
</html>
